<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0E2A47" />
  <title>NRCC Work Permit System</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <div class="login-wrap"><div class="login-card"><div class="sub">Loading…</div></div></div>
  </div>
  <div id="modal-root"></div>
  <div class="toast-wrap" id="toast-root"></div>
  <div id="print-area"></div>

  <script type="module" src="app.js"></script>
  <script>
    // Register the service worker (offline app shell).
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js").then((reg) => {
          // Periodically check for a new service worker so long-running installs
          // stay up to date without a manual reinstall.
          setInterval(() => reg.update().catch(() => {}), 30 * 60 * 1000);
        }).catch((e) => console.warn("SW registration failed:", e));
      });
    }
  </script>
</body>
</html>
